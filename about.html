<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลส่วนตัว - PinPreeyapat</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="garden-card">
        <div class="flower-top">🌸 🌿 🌷 🌿 🌸</div>
        
        <div class="avatar">
            <span>🌺</span>
        </div>
        
        <h1>นางสาวพิณปรียาภัทร ...</h1>
        <div class="role">✨ นักศึกษาสาขาเทคโนโลยีสารสนเทศ ✨</div>
        
        <div class="info-box">
            <div class="info-item">
                <span class="label">🌷 ชื่อเล่น:</span>
                <span class="value">พิณ</span>
            </div>
            <div class="info-item">
                <span class="label">🌱 อายุ:</span>
                <span class="value">19 ปี</span>
            </div>
            <div class="info-item">
                <span class="label">🪪 รหัสนักศึกษา:</span>
                <span class="value">66xxxxxxx</span>
            </div>
            <div class="info-item">
                <span class="label">🎨 งานอดิเรก:</span>
                <span class="value">เขียนโค้ด, ฟังเพลง, ดูหนัง</span>
            </div>
            <div class="info-item">
                <span class="label">💌 อีเมล:</span>
                <span class="value">pinpreeyapat@example.com</span>
            </div>
        </div>

        <div class="footer-garden">
            🍃 ยินดีต้อนรับสู่สวนเล็กๆ ของฉัน 🍃
        </div>
    </div>

</body>
</html>
